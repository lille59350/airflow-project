services:
  metabase:
    image: metabase/metabase@sha256:3b968d64944840ec0ed452a94fb58301a0a8d8e4fe6d632a5956014a91a2b635
    container_name: novaretail-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres-metier
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: metabase_user
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Mot de passe Metabase non defini}
      MB_SESSION_SECRET_KEY: ${MB_SESSION_SECRET_KEY:?Cle de session non definie}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?Cle de chiffrement non definie}
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    networks:
      - novaretail-network
    restart: unless-stopped

networks:
  novaretail-network:
    external: true
    name: airflow-project_default