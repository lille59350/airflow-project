services:
  crm-api:
    build:
      context: ./services/crm-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  minio:
    image: quay.io/minio/aistor/minio@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3
    command: server /data --console-address ":9001" --license /run/secrets/minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER non defini}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD non defini}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - ./secrets/minio/minio.license:/run/secrets/minio.license:ro
    restart: unless-stopped

volumes:
  minio-data: